descriptionTextPane.text=\u0421\u043B\u0435\u0432\u0430 \u0432\u044B \u0432\u0438\u0434\u0438\u0442\u0435 \u0438 \u043C\u043E\u0436\u0435\u0442\u0435 \u0440\u0435\u0434\u0430\u043A\u0442\u0438\u0440\u0432\u043E\u0430\u0442\u044C \u0434\u0435\u0440\u0435\u0432\u043E \u043A\u0440\u0438\u0442\u0435\u0440\u0438\u0435\u0432 \u0434\u043B\u044F \u043F\u0440\u0438\u043D\u044F\u0442\u0438\u044F \u0440\u0435\u0448\u0435\u043D\u0438\u044F - \u0433\u043B\u0430\u0432\u043D\u043E\u0439 \u0446\u0435\u043B\u0438 (\u0432\u0435\u0440\u0448\u0438\u043D\u0430 \u0434\u0435\u0440\u0435\u0432\u0430).\n\u0412\u044B \u043C\u043E\u0436\u0435\u0442\u0435 \u0434\u043E\u0431\u0430\u0432\u043B\u044F\u0442\u044C, \u0440\u0435\u0434\u0430\u043A\u0442\u0438\u0440\u043E\u0432\u0430\u0442\u044C \u0438 \u0443\u0434\u0430\u043B\u044F\u0442\u044C \u0443\u0437\u043B\u044B \u0434\u0435\u0440\u0435\u0432\u0430 \u0441 \u043F\u043E\u043C\u043E\u0449\u044C\u044E \u0432\u0441\u043F\u043B\u044B\u0432\u0430\u044E\u0449\u0435\u0433\u043E \u043C\u0435\u043D\u044E \u043F\u043E \u043D\u0430\u0436\u0430\u0442\u0438\u044E \u043F\u0440\u0430\u0432\u043E\u0439 \u043A\u043D\u043E\u043F\u043A\u0438 \u043C\u044B\u0448\u0438.\n\u041A\u043E\u0440\u0435\u043D\u044C \u0434\u0435\u0440\u0435\u0432\u0430 - \u0433\u043B\u0430\u0432\u043D\u0430\u044F \u0446\u0435\u043B\u044C \u043F\u0440\u0438\u043D\u044F\u0442\u0438\u044F \u0440\u0435\u0448\u0435\u043D\u0438\u044F. \u041E\u043D\u0430 \u0441\u0432\u044F\u0437\u0430\u043D\u0430 \u0441 \u043A\u0440\u0438\u0442\u0435\u0440\u0438\u044F\u043C\u0438, \u043A\u043E\u0442\u043E\u0440\u044B\u043C\u0438 \u043E\u043F\u0440\u0435\u0434\u0435\u043B\u044F\u0435\u0442\u0441\u044F \u0433\u043B\u0430\u0432\u043D\u0430\u044F \u0446\u0435\u043B\u044C.\n\u041A\u0430\u0436\u0434\u044B\u0439 \u0443\u0437\u0435\u043B \u0434\u0435\u0440\u0435\u0432\u0430 \u0434\u043E\u043B\u0436\u0435\u043D \u0441\u043E\u0434\u0435\u0440\u0436\u0430\u0442\u044C \u043E\u0442 2 \u0434\u043E 9 \u043F\u043E\u0442\u043E\u043C\u043A\u043E\u0432. \u041F\u0440\u0438 \u043D\u0435\u043E\u0431\u0445\u043E\u0434\u0438\u043C\u043E\u0441\u0442\u0438 \u0434\u043E\u0431\u0430\u0432\u0438\u0442\u044C \u0431\u043E\u043B\u044C\u0448\u0435 \u0440\u0435\u043A\u043E\u043C\u0435\u043D\u0434\u0443\u0435\u0442\u0441\u044F \u0440\u0430\u0441\u043F\u0440\u0435\u0434\u0435\u043B\u0438\u0442\u044C \u0438\u0445 \u043C\u0435\u0436\u0434\u0443 \u043D\u0435\u0441\u043A\u043E\u043B\u044C\u043A\u0438\u043C\u0438 \u043A\u0440\u0438\u0442\u0435\u0440\u0438\u044F\u043C\u0438 \u0432\u044B\u0441\u0448\u0435\u0433\u043E \u0443\u0440\u043E\u0432\u043D\u044F.
